# The product owner's callouts and junctions, per map (Story 4.13, AD-13).
#
# WHAT THIS IS. The report prints his callouts instead of the game's area
# names (the routes since Story 4.13, every other row since Story 4.15), and
# the routes compress each player's path to the places that matter: the
# start, the junctions and the end. Both need knowledge the demo does not
# hold -- what he calls a place, and which places he treats as junctions --
# and this file is that knowledge. The statistics are counted under the
# callouts; the anomaly rules never read this file -- they run on the game's
# areas, where they were calibrated, and only their rows' names translate.
#
# WHY A TABLE (AD-13). Derivation runs first and wins where it can answer;
# the table holds what it structurally cannot. Two things here are of that
# kind, and AD-13 names both: his VOCABULARY where it differs from the
# game's (the game's Control is his radio, its Observation his control), and
# which places are his DECISION POINTS. The measurement that made the table
# necessary: on the archive's 2026-09-20 de_nuke T pistol round the
# four-point route read "Outside -> Control", which the dense moves rule out
# (Control is entered only from Ramp, Trophy or Vending;
# saavutettavuus-mitattu-2026-09-26.md), and the real way ran through Lobby.
#
# WHY HIS LIST WINS OVER THE NEIGHBOUR COUNT. A neighbour count answers "an
# area with many exits", not "his decision point": Nuke's Garage has one
# neighbour and is a contact point in his account, Admin has five and is
# transit to him. Derivation cannot answer the question he answers, which is
# AD-13's own exception, so ``neighbours`` is recorded as advisory and never
# read by the route. The rule that decides every entry:
#   junction = his account names the place as a junction, a contact point or
#              a point where the way divides, or it is a bomb site or spawn;
#   otherwise transit.
# An entry gives a reason of its own only where his words say more than that.
#
# WHERE IT CAME FROM. Every entry names its source: a document of the BMAD
# output by file name (his answers in the Story 4.13 review are in
# alueomistus-pohja-2026-09-26.md, section "Answers of 2026-09-26 in the
# Story 4.13 review"), or the project memory by name. Those documents are not in
# this repository (they live beside it), so an entry quotes the words it
# rests on. Nothing here was written from memory. One document is cited
# without its file name: the product owner's first route model (Nuke,
# Ancient, Anubis, 2026-09-02 to 09-12) is named after him, and the public
# repository names no person, so it appears as "the first route model
# (reittimalli-<owner>.md)" -- a placeholder that matches no other file.
#
# CONFIDENCE, and what the report prints for it:
#   stated   -- his words, or a callout he confirmed for the place
#   guide    -- the game area's own name is one of the guide's callouts for
#               the map (calloutit.md's list, compared ignoring case and
#               spaces: Alley = ALLEY), UNLESS THE COORDINATES CONTRADICT
#               IT. A name match is not a place match: the game's Ruins on
#               de_ancient shares the guide's name RUINS but lies on the
#               guide's B DOORS (koordinaatit-mitattu-2026-09-27.md section
#               1). A new guide entry is certain on the name alone until the
#               coordinates check it; the entries checked on 2026-09-27 are
#               those in tests/data/guide_fit.json or in section 1 of that
#               document, and every one of them but Ruins holds.
#   measured -- the coordinates CONFIRM a callout another source already
#               proposed (his words, his guess, or a guide name): the area's
#               live ticks, projected onto the guide image, meet that
#               callout's label box in tests/data/guide_fit.json. The boxes
#               are read by hand from the image; the fit is
#               koordinaatit-mitattu-2026-09-27.md's, and the check runs on
#               the archive (-m archive). It raises a mark and never gives a
#               name: a callout only the coordinates propose stays inferred,
#               which is why Ruins = b doors is inferred. A measured area may
#               spill onto guide labels that are not his callouts --
#               TSideUpper touches CAT, ExtendedA reaches NINJA -- and it is
#               coarse only when it covers several of HIS callouts.
#   inferred -- a reading the source itself marks as inferred, unconfirmed or
#               a match of names that is not exact, or a callout only the
#               coordinates propose. For a PART of a split (Story 4.20,
#               narrowing Story 4.18's rule that every reading of ours is
#               inferred): a reading of his cells that MOVES a counted
#               position of the split area is inferred until he confirms
#               it; a reading that moves none stays stated, with the
#               reading written in its source; and a name that is the
#               lead's and not his is inferred (mid doors window)
#   guess    -- he offered it as his own guess
#   unnamed  -- the place has no callout at all (``callout`` is absent)
# stated, guide and measured are CERTAIN and print unmarked; inferred and
# guess print with a mark, and a callout fed by several areas is marked if
# any of them is not certain. The same holds for the parts of splits: one
# part that is not certain marks its callout in every row of the map, on
# every split and on the area its own name merges with (Story 4.26: an
# inferred window part would mark Hole's own positions too). unnamed prints
# the game's name with its own mark.
#
# THE KEYS. One section per map, ``[<map>.<game area>]``. An unknown map is
# refused at load (it must be in ``[league].map_pool``), and so is an unknown
# key in an entry or an empty map. An area name is NOT checked at load -- the
# loader has no list of the game's areas; a misspelt area is caught only by
# ``-m archive`` (tests/test_calibration.py re-derives every entry's
# neighbour count and requires the table to cover exactly the areas the
# archive moves through).
#   callout         -- his callout for the area, compared ignoring case and
#                      surrounding spaces. ABSENT means the place has no
#                      callout: the report prints the game's name, flagged.
#                      Two areas with one callout are one place to him: the
#                      route merges them and the statistics count them as
#                      one.
#   coarse          -- the area holds several of his callouts (Nuke's yard is
#                      one game area); the report prints the coarse name,
#                      flagged -- unless the area is split (below); then only
#                      its rule rows and the positions the split cannot
#                      place do. Never split by guess: only by his own
#                      division.
#   split           -- the area divided by POSITION into his callouts (Story
#                      4.17), on a grid over his guide image -- Nuke's the
#                      guide's own, Ancient's a generated 425-unit grid from
#                      pixel (0, 0) (grid2.py) -- as he gave it half-cell by
#                      half-cell against pictures of that grid. A split
#                      area's own callout stays what a RULE row on the whole
#                      area prints (the rules measured the whole area and are
#                      calibrated there). A coarse area's split places every
#                      position it can. ON AN AREA THAT IS NOT COARSE (Story
#                      4.23, Nuke's Lobby) the loader accepts a split in one
#                      form only: the area keeps its own callout, with the
#                      area's own flag (never coarse), for its rule rows and
#                      for every position no part's half-cell, box or region
#                      and band holds; the parts are finer places inside it;
#                      and the NEAREST rule below does not apply, because the
#                      rest of the room is the area. The form is derived from
#                      coarse in code, so no key here can say otherwise. Its
#                      keys: image, fit (the Story 4.16 projection
#                      px = sx*x + bx, py = -sy*y + by,
#                      unrounded as the pictures were drawn -- one value per
#                      floor of a map, carried by each split on that floor
#                      and refused if it differs; tests/data/guide_fit.json
#                      reads it through fit_from), zmin and zmax (THE FLOOR,
#                      Story 4.24: the split holds a position only with
#                      zmin <= z < zmax; one outside keeps the area's own
#                      name, coarse or not; a side is absent where the fit
#                      has no floor cut there), origin
#                      and cell (the grid's top-left pixel and one cell's
#                      size), columns and rows, source, and parts. ONE GRID
#                      PER FLOOR (Story 4.18, per floor since Story 4.24):
#                      the splits of one map whose floors overlap are on one
#                      floor, so zmin and zmax must be the same on them, and
#                      so must image, fit, origin, cell, columns and rows;
#                      the loader refuses otherwise. Splits on floors that do
#                      not overlap may have different grids: Nuke's guide
#                      draws its lower floor apart, so the upper floor (zmin
#                      -470: the yard, lobby) and the lower (zmax -470: B
#                      site, ramp's lower part, tunnels, control) each have
#                      their own fit. A position is looked up on its area's
#                      split, and only if that split's floor holds its z.
#                      An area has one split, so an area that
#                      spans both floors is split on one, and its positions
#                      on the other keep its own callout. A part
#                      is one of his places: callout, junction,
#                      junction_source, confidence, source and note as an
#                      area's, plus cells (half-cells he named, e.g. K13b:
#                      a top-left, b top-right, c bottom-left, d
#                      bottom-right) and boxes (pixel rectangles
#                      [x0, y0, x1, y1] for a place smaller than a
#                      half-cell, overriding the half-cells beneath). On a
#                      coarse area, a half-cell nobody names takes its
#                      NEAREST named half-cell's callout, by centre
#                      distance, a tie to the
#                      part first in the file (his "liitä loput
#                      lähimpään"); that is derived in code
#                      (CellSplit.inherited), never written here. A part
#                      named like an area IS that place: the two must agree
#                      on junction, and the area must not be coarse; the
#                      counts merge.
#                      FINER THAN A HALF-CELL (Story 4.20). A part may also
#                      hold regions, each { cell, x, y, z, words } -- a
#                      fraction of one half-cell, x and y ranges in [0, 1]
#                      from its left and TOP (the top fifth is y = [0,
#                      0.2]) -- or { crossing, size, z, words }: the point
#                      where the named half-cells meet, as a box size
#                      half-cells wide and high. size is REQUIRED and has no
#                      default: the precedents (postimerkki, ct box, dig) are
#                      boxes of one half-cell, and his short boost is one in
#                      his own words. z = [lo, hi] is a height band: the
#                      region holds a position only with lo <= z < hi, and
#                      ONLY WHERE A PLAYER STANDS (Story 4.23, the lead's
#                      decision): a band is measured on players' ticks, so
#                      it holds a tick, a death's victim and attacker and a
#                      throw, and never a grenade's detonation, which may
#                      burst in mid-air. A throw's position is the grenade's
#                      first point, in the thrower's hand -- about 70 units
#                      above his feet (Nuke lobby's throws: z -367 to -344
#                      over a -416 floor, measured 2026-09-29). A detonation
#                      falls to the next claim with no band, then to the
#                      area's rest or the nearest half-cell, as the split's
#                      form says.
#                      THE BAND RULE, a lead decision of 2026-09-29 (Story
#                      4.23) that SUPERSEDES Story 4.20's two-level rule and
#                      keeps its numbers. The live ticks of the map ON THE
#                      SPLIT'S FLOOR (zmin <= z < zmax, Story 4.24) inside
#                      a band's regions are sorted by z and cut at the FEWEST
#                      of their largest gaps such that each cut gap is at
#                      least 36 units (twice the game's 18-unit step, so no
#                      walking crosses it) and at least 1.5 times the largest
#                      gap not cut; the levels between the cuts must then
#                      each hold at least 5 ticks. A band exists only where
#                      this gives two levels or more. Each band edge is the
#                      midpoint of a cut gap, to two decimals, and a part on
#                      a middle level carries a closed band [lower edge,
#                      upper edge]. With one cut gap it is Story 4.20's
#                      two-level rule unchanged: at least 5 ticks on each
#                      side of the largest gap in their z, the gap at least
#                      36 units and at least 1.5 times the second-largest
#                      gap. The FEWEST and not every gap of 36 units:
#                      cutting every such gap re-derives Anubis's -64.12
#                      band differently (measured 2026-09-29). Which part is
#                      on which level is derived where the game's areas tell
#                      the levels apart (the source names the game area of
#                      each level) and rests on his words where they do not.
#                      A place he names by height that fails the rule gets
#                      no band, and its source says so -- with one
#                      exception, THE CARRIED BAND (Story 4.24, the lead's
#                      decision of 2026-09-29): when he names the same
#                      level in a half-cell whose ticks the rule cannot
#                      separate, the band is measured on the half-cells
#                      the rule admits and carried to the others by his
#                      word; the source says so ('the band is carried to
#                      <half-cells> by his word'), and the carried
#                      half-cells are his words (Nuke's hattuhylly in I11a,
#                      b rafters in D6d). A BAND CARRIED FROM ANOTHER PART'S
#                      REGION (Story 4.24, written here in Story 4.28): when
#                      this part's own region fails the rule and his words
#                      put its level on one side of another part's edge
#                      (reached from its top, at its height), the band is
#                      that part's edge, carried by his word; the source
#                      says so as above and names the part it is measured
#                      on, and the tests hold it to a part whose own region
#                      gives that edge. Nuke's hutLadder takes hattuhylly's
#                      upper edge in I11a (the ladder above the shelf), and
#                      Inferno's kakkonen ykkönen's edge ('Sen päälle pääsee
#                      hyppäämällä ykkösen päältä'). And A HALF-OPEN BAND WHOSE EDGE
#                      IS A CLOSED BAND'S EDGE is read at the closed band's
#                      measurement. All of it is re-derived by -m archive.
#                      words is his phrase the region is read from. A
#                      position takes the FIRST part in table order whose
#                      half-cell or region (and band) holds it -- table order
#                      decides, not the kind of claim -- so finer parts come
#                      first; then the nearest named half-cell, as above.
#                      Two parts may claim one spot at one height only when
#                      the later one says broad = true: THIS PART YIELDS TO
#                      EVERY EARLIER PART IT OVERLAPS. That covers his
#                      broader name over the finer ones inside it (banaani,
#                      yläbanaani) and the place he gives "minus" another
#                      (miinus, paitsi). A broad part that overlaps nothing
#                      is refused.
#                      THE SIZE RULE FOR SIZES HE DID NOT QUANTIFY, HIS SINCE
#                      2026-09-28: proposed by the lead (A1 and A2 of
#                      puoliruudut-taulukot-2026-09-28.md) and confirmed by
#                      him (puoliruudut-vastaus-2-2026-09-28.md section 'His
#                      answers after Story 4.20, evening 2026-09-28', answer
#                      2: 'Sopii'): an edge he does not quantify (yläreuna,
#                      alareuna, oikea reuna) is 1/4 of the half-cell on that
#                      side; a corner he does not quantify (vasen ylänurkka
#                      ...) is half its width by half its height, his own size
#                      for a corner ('vasen nurkka (puolet korkeudesta ja
#                      leveydestä)'); and an edge named with a side ('oikea
#                      alareuna', 'yläoikeasta reunasta') is that corner. A
#                      part's source says where it rests on this rule.
#                      A RISTEYS OF TWO (Story 4.26). His "risteys", in any
#                      inflection (risteyksessä, risteyksen: the tests read
#                      risteys and risteyks), names a crossing box only
#                      where the half-cells meet at one point. Two
#                      half-cells that share an edge meet at no point, and
#                      the loader refuses a crossing of them, so his
#                      risteys of two is read as that edge, a quarter deep
#                      on each side by the size rule, written as one
#                      fraction on each side.
#                      Its limit: the depth is the size rule's and not his,
#                      so such a part is inferred where it moves positions.
#                      It departs from the lead's decision 5 of spec-4-26
#                      (a crossing uses the Story 4.20 crossing form), which
#                      cannot hold two half-cells, and from postimerkki's
#                      precedent (Story 4.17), a pixel box laid on the edge
#                      where K13b and L13a meet, which no region can write.
#                      parts_from = "<Area>" in a split reads that area's
#                      split parts instead of writing its own: one table for
#                      several splits of a map (Inferno's five; Ancient's
#                      CTSpawn, borrowing BombsiteA's, Story 4.27), each still
#                      renaming only its own area's positions. The borrower
#                      must agree with the lender on junction: by the second
#                      clause of A PART'S JUNCTION a shared part that holds
#                      positions of several reading areas takes their common
#                      junction, and every split that reads the table can
#                      hold positions under any of its parts -- so the
#                      readers must agree, or that clause has no single
#                      value.
#                      A PART'S JUNCTION (the Story 4.18 rule, and Story 4.20
#                      for parts outside their area): a part named like an
#                      area takes that area's; else a part holding positions
#                      of its split areas takes theirs; else it takes the
#                      junction of the game area its region lies in, by the
#                      map's live ticks -- or, where no live tick of the map
#                      lies in it, by THE GUIDE PICTURE (Story 4.26, written
#                      here in Story 4.28): its basis then reads "holds none
#                      of its split areas' live ticks and no live tick of the
#                      map lies in it; it lies in the game's <area> on the
#                      guide picture", and the tests hold the parts that take
#                      the form, and their areas, to a closed set. POSITIONS,
#                      in these clauses, ARE THE ARCHIVE'S LIVE TICKS, as the
#                      tests count them: a part that names only deaths or
#                      utility events of its split areas holds none (Inferno's
#                      dark and longbox name a few). Each part's source ends
#                      with the
#                      "Junction basis" it rests on, which the tests hold the
#                      flag to. The first clause WINS OVER "a split never
#                      removes its area's junction" (Story 4.18): one place
#                      has one junction value, so a part named like another
#                      area takes that area's junction even inside a split
#                      of a junction area. It first bites on Nuke's lower
#                      floor (Story 4.25): alakerran sinkku, the game's
#                      Decon (transit), holds 8 BombsiteB ticks in C7a.
#                      On Dust2 (Story 4.26) it bites twice: short a, the
#                      game's ExtendedA (transit), holds 14 BombsiteA ticks
#                      on BombsiteA's split, and short stairs, the game's
#                      ShortStairs (a junction), holds 15 ExtendedA ticks on
#                      ExtendedA's split. On Inferno (Story 4.28) it bites
#                      twice on the sites' splits: ruins, the game's Ruins
#                      (transit), holds 7 BombsiteB ticks in G3d, and pit,
#                      the game's Pit (transit), holds 1 BombsiteA tick in
#                      K12b -- 8 site positions made transit.
#                      HIS WORD FIRST (Story 4.26, the lead's decision on
#                      his ct cross answer): where his own words name a
#                      part a choice point, the part is a junction on every
#                      split, before every clause above. Its basis then
#                      reads "his words make it a junction, a choice point:
#                      '<his words>'; it holds positions of <areas>", the
#                      areas re-derived from the archive, and its
#                      junction_source quotes the same words. A part named
#                      like an area cannot take a junction from his words
#                      that differs from that area's: the loader holds one
#                      callout to one junction, so there his words make the
#                      area itself a junction, by the area rule at the top
#                      of this file. It first bites on Dust2's ct cross,
#                      which lies in the transit UnderA and in the junction
#                      LongA; the tests hold the parts it decides to a
#                      closed set.
#                      ONE PLACE OVER A TRANSIT AREA AND A JUNCTION AREA
#                      (Story 4.27, the lead's decision #15 on
#                      ancient-taulukot-2026-10-01.md): a place of his that
#                      holds positions of a transit area and of a junction
#                      area is built on the split of the area that holds most
#                      of them only, and its other positions keep their own
#                      area's callout -- because one callout has one
#                      junction. Where the place's positions are decides it,
#                      as for Dust2's fast cat, which stayed off CTSpawn's
#                      split (Story 4.26). It first bites on Ancient's long
#                      toka kulma: 16 Alley (transit) and 3 BombsiteB
#                      positions, built on Alley's split.
#                      A PASSAGE (Story 4.18, the spec 4.18 review; written
#                      here in Story 4.27): a part that is a way to
#                      somewhere, not a place, is transit although its split
#                      area is a junction -- Ancient's outside main, his
#                      'towards a main', and vent, which his words only place
#                      ('Vent = I8a,I8b'): its reading as the way between
#                      ruins and dig is the lead's, in Story 4.18. Its basis
#                      reads 'a way to somewhere, not a place'. The basis form
#                      is read where a split is registered for the tests of
#                      junction bases; Outside's split carries no basis
#                      lines, so outside main states its reading in its
#                      source only. The tests hold the parts that take the
#                      form to a closed set.
#                      THE ORDER OF THE JUNCTION CLAUSES (Story 4.27), as the
#                      tests apply them: HIS WORD FIRST; then A PASSAGE; then
#                      the first clause of A PART'S JUNCTION (a part named
#                      like an area takes that area's); then its second (a
#                      part holding positions of its split areas takes
#                      theirs, on each split), with its third for a part
#                      holding none; and last the majority clause above, the
#                      fallback when the second clause's areas disagree and
#                      no earlier clause fixes the junction. The earlier
#                      clauses already settle three parts that hold a transit
#                      area's and a junction area's positions: ct cross (his
#                      word), short a and alakerran sinkku (the first
#                      clause). The first clause also settles, over "a split
#                      never removes its area's junction", Inferno's ruins
#                      and pit (Story 4.28): 7 BombsiteB and 1 BombsiteA
#                      positions made transit.
#   junction        -- see the rule above. A transit place drops out of the
#                      middle of a route; a place with no callout is always
#                      kept, so the flag stays visible.
#   junction_source -- the words that make it a junction.
#   neighbours      -- the derived, advisory check: how many distinct areas
#                      the dense archive moves between this one and, counting
#                      a neighbour only when at least three moves were
#                      observed. Living players, time sample points at most
#                      3 s apart, every round and both sides, every demo of
#                      the map. Measured 2026-09-26 and re-derived by
#                      ``-m archive``, so it is a checked measurement and not
#                      a copy.
#   confidence, source, note -- as above.
#
# Only callout, junction, coarse, confidence and split change the report, and
# only those go into the aggregate's parameter hash (AD-1): editing one of
# them re-runs ``aggregate``; editing a source, a note, a neighbour count, a
# split's image, a region's words or a comment does not. A split's parts are
# hashed in their order, because table order decides a shared spot.

