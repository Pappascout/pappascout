t hattuhylly -- in I11a every Lobby position off the ground is hutLadder, as his 'kun niitä kiivetään' says. KNOWN LIMIT: 7 of those 12 lie exactly at -287.97, the shelf's floor, and his sketch puts the shelf on both sides of the ladder, so they are probably the shelf. Measured on I10c, I11c and I11a together (750 live ticks), the rule gives two levels and not three: the ladder's ticks fill the shelf's upper gap, the largest gap alone (-377.23 to -291.91, 85.33 units) is cut, and the next (37.42) is not 1.5 times 22.69 -- so no band separates the shelf in I11a, and hattuhylly stays I10c and I11c. Junction basis: holds positions of Lobby"

