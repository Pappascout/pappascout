adder's source) -- so the band is measured on the two half-cells the rule admits, and his words make the shelf one level across all three. In I11a it names 14 Lobby ticks (7 of them at the shelf's floor, z -287.97), which were hutLadder before Story 4.24 (bsite-taulukot-2026-09-29.md ambiguity 26). KNOWN LIMIT: 2 of the 14 are the ladder and not the shelf -- z -254.02 and -216.59, above the shelf's floor and under its upper edge -216.29 -- because the band measured on I10c and I11c is carried to I11a whole, and I11a's own ticks cannot move its edge. Junction basis: holds positions of Lobby"

