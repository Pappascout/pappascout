[project]
name = "pappascout"
version = "0.1.0"
description = "Pappaliiga CS2 -scouting: demoista kierrostyypit, asetelmat ja Markdown-raportti"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "demoparser2>=0.42.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "zstandard>=0.25.0",
]

[project.scripts]
pappascout = "pappascout.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
