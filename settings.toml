# Pappascoutin asetukset.
#
# Osiot vastaavat AD-3:n partitiota: jokainen vaihe saa parametrikseen vain oman
# osansa, joten kynnysten muuttaminen ei aiheuta uudelleenparsintaa.
#
# Jokainen luku on jäljitettävissä lähteeseen. Merkinnät:
#   [addendum]  = PRD:n addendum, luku 6 (CS2-talousmalli) tai luku 4/5
#   [domain]    = domain-tutkimus 2026-08-27
#   [spine]     = ARCHITECTURE-SPINE, AD-3 / AD-6 / AD-7 / AD-10
#   [kalibroi]  = arvo, joka on tarkoitus säätää oikealla aineistolla; rivin
#                 oma kommentti kertoo mitä havaintoa se odottaa
#
# Avaimia EI kirjoiteta tähän tiedostoon. Ne luetaan koneen omasta tiedostosta
# %USERPROFILE%\.pappascout\.env (FACEIT_API_KEY, FACEIT_DOWNLOADS_TOKEN).


[project]
# Oma joukkue. [domain] Pappaliigan kausi 13.
own_team_name = "PotkukelkkaPeek"

# Arkisto on OneDrivessa ja molempien koneiden yhteinen; koodirepo ei ole.
# [spine] AD-7.
#
# Polussa saa kayttaa ymparistomuuttujia (%USERPROFILE%) ja tildea (~); ne
# laajennetaan latausvaiheessa, joten sama versioitu rivi toimii molemmilla
# koneilla vaikka kayttajanimi olisi eri.
#
# Yksittaisen ajon voi ohjata toiseen arkistoon muokkaamatta tata tiedostoa
# asettamalla ymparistomuuttujan PAPPASCOUT_ARCHIVE_ROOT, esim. PowerShellissa:
#   $env:PAPPASCOUT_ARCHIVE_ROOT = 'D:\pappascout-testiarkisto'
archive_root = '%USERPROFILE%\OneDrive - Finnpark Oy\Finnpark\MDM\Claude code\pappascout-archive'

# Kaikki käyttäjälle näkyvä teksti on suomeksi.
language = "fi"

# Arkiston lukon vanhenemisaika sekunteina. [spine] AD-7 oletus 600.
lock_ttl_seconds = 600


[league]
# Pappaliigan kausi 13, alkoi 3.8.2026. [domain]
season = 13

# Pappaliigan FACEIT organizer -id, jonka kautta kausien championshipit löytyvät.
# [addendum] luku 5.
organizer_id = "1bfc69fa-5a21-4ed9-9ef3-37edbd7210d8"

# Nykyinen kausi ensin. Edellisten kausien id:t lisätään tähän listaan, kun
# historiaa halutaan mukaan otantaan.
championship_ids = ["94681888-b5da-4ab5-bf50-f44b666b98a3"]

# Kauden 13 karttapooli. Overpass poistui Active Dutysta 7/2026, Cache tuli
# tilalle; Pappaliiga lukitsee poolin kauden alkaessa. [domain]
map_pool = [
    "de_mirage",
    "de_inferno",
    "de_dust2",
    "de_nuke",
    "de_ancient",
    "de_anubis",
    "de_cache",
]

# PotkukelkkaPeek banaa lähes aina Miragen ja Dust II:n. [domain]
own_default_bans = ["de_mirage", "de_dust2"]

# MR12: 12 kierrosta per puoli, 13 voittaa. [addendum]
mr = 12

# Jatkoajan aloitusraha Pappaliigan sääntökirjassa 12 500 $ (pro-turnauksissa
# yleisesti 10 000 $). [domain] [addendum]
ot_start_money = 12500


[parse]
# Näytepisteet sekunteina viimeisestä round_freeze_endistä.
# ~6 s CT-suunta näkyy, ~10-15 s T rush erottuu defaultista, 25-30 s ja 45 s
# näyttävät kierroksen kehityksen. [domain] [spine] AD-3 oletus [6, 15, 30, 45].
# Arvojen on oltava positiivisia, äärellisiä, keskenään eri suuria ja enintään
# kierroksen keston (115 s) mittaisia; lataus tarkistaa tämän.
snapshot_seconds = [6.0, 15.0, 30.0, 45.0]

# Ostoajan pituus sekunteina freezetimen päättymisestä. Talousluvut luetaan
# ostoajan lopusta, ei freezetimen lopusta. Mittauspiste on
#
#   max(freezetimen loppu,
#       min(freezetimen loppu + tämä,
#           kierroksen ensimmäistä kuolemaa EDELTÄVÄ tick,
#           kierroksen loppu))
#
# Kuolemaa EDELTÄVÄ tick eikä kuoleman tick: kuolleen tavaraluettelo on jo
# tyhjä ja panssari nolla, joten kuolintickiltä luettuna joukkueesta katoaisi
# yhden pelaajan koko kalusto. Uloin max on alaraja, joka estää mittauspistettä
# valumasta freezetimen sisään, jos kuolema osuu heti ankkurin jälkeen.
#
# MIKSI 20 -- LINJAUS, JOKA ON YHTEENSOPIVA MITTAUKSEN KANSSA.
# Käyttäjä 2026-08-29: "Buy time on mielestäni 20 sekuntia jokaisen kierroksen
# alusta eli freezetimen päätyttyä." Sana "mielestäni" on siinä, joten tätä ei
# esitetä todistettuna pelin sääntönä vaan linjauksena, jonka mittaus tukee:
# viidestä liigademosta (106 kierrosta, 52:lla ostettiin vielä freezetimen
# jälkeen) ostaminen oli valmis 20 sekunnin kohdalla 100 %:ssa. Mittaus on
# yhteensopiva 20 sekunnin ostoajan kanssa muttei todista sitä -- pisin
# havaittu osto oli 19,4 s, eikä aineisto voi kertoa mitä 20,5 sekunnin
# kohdalla olisi tapahtunut.
#
# Linjaus on silti vahvempi peruste kuin kalibroitu arvo, ja kolmesta syystä:
#
#  1. Se ei vaadi kalibrointia eikä vanhene uuden aineiston myötä. Viisi
#     sekuntia kattaisi 85 % ja olisi käyttäjän oma arvio, mutta se olisi luku
#     joka pitäisi säätää joka kerta kun uusi demo tuo pidemmän oston.
#     Kertymä: 3 s 62 %, 5 s 85 %, 8 s 92 %, 15 s 98 %, 20 s 100 %.
#     Mediaani 2,1 s, p90 5,8 s, max 19,4 s.
#  2. Se ei maksa mitään. Yhdelläkään 106 kierroksesta ei kuolla ennen kuin
#     ostaminen loppuu, joten pidempi ikkuna ei tuo roskaa mukanaan. Ajo
#     mittaa tämän joka kerta uudelleen ja kertoo tuloksen rivillä "Kuoleman
#     katkaisu" -- jos ikkuna joskus alkaa maksaa, se ei jää huomaamatta.
#  3. Hännän kahdeksan kierrosta (5,1 · 5,2 · 5,8 · 6,1 · 11,0 · 11,3 · 13,5 ·
#     19,4 s) ovat juuri ne kiinnostavat: kymmenen sekunnin miettiminen
#     tarkoittaa vaikeaa ostopäätöstä forcen ja säästön väliltä, mikä on
#     scoutingin kannalta arvokkaampaa kuin rutiinitäysosto.
#
# Mittauspiste on **yksi tick koko kierrokselle**, ei pelaajakohtainen:
# mittaushetkellä kukaan ei ole vielä kuollut eikä siis ehtinyt pudottaa
# asettaan, joten kaksoislaskenta (joukkuekaveri poimii vainajan kiväärin) on
# rakenteellisesti poissuljettu.
#
# Kuoleman katkaisu on normaali polku eikä poikkeus: kuudessa demossa
# (134 pelattua kierrosta) se osuu 69 kierrokseen eli 51 %:iin, joten
# efektiivinen mittaushetki on usein 10-20 s eikä 20 s. Ajon tuloste kertoo
# todellisen jakauman kierroslistan kanssa samasta taulusta.
#
# Arvon muuttaminen mitätöi parsinnan tuloksen ([parse]-osio on osa
# parametrihashia), eli demot parsitaan uudelleen. Sallittu väli on 0-40 s;
# 0 tarkoittaa "mittaa freezetimen lopusta" eli tätä edeltänyttä
# käyttäytymistä.
# [domain] käyttäjän linjaus 2026-08-29 [mitattu viidestä liigademosta]
buy_window_seconds = 20.0

# Ensikontakti = ensimmäinen player_hurt, jossa tekijä on vastapuolella ja ase ei
# ole utility. Nämä aseet eivät siis kelpaa ensikontaktiksi. [spine] AD-5.
#
# Nimet on luettu demoparser2:n player_hurt-tapahtuman weapon-kentästä
# (Story 2.1). Ancient-demossa esiintyivät: ak47, awp, deagle, elite, famas,
# fiveseven, galilar, glock, hegrenade, hkp2000, inferno, knife, m4a1, mac10,
# molotov, mp7, mp9, nova, p250, planted_c4, smokegrenade, ssg08, tec9.
#
# Merkintä [havaittu] = ase esiintyy Ancient-demon vahinkotapahtumissa.
# Merkintä [oletettu] = nimi on CS2:n vakionimi, mutta tällä aseella ei ollut
# Ancientissa yhtään vahinkotapahtumaa, joten kirjoitusasua ei ole todennettu.
# Väärä kirjoitusasu ei kaada mitään -- se vain jättää aseen poissulkematta,
# jolloin utilityosuma voisi laskea ensikontaktiksi.
first_contact_exclude_weapons = [
    "hegrenade",     # [havaittu]
    "flashbang",     # [oletettu] flash tekee vahinkoa vain harvoin
    "smokegrenade",  # [havaittu]
    "decoy",         # [oletettu] harjoitusgranaatti, vahinko poikkeuksellista
    "molotov",       # [havaittu] T-puolen polttopullo
    "incgrenade",    # [oletettu] CT-puolen vastine; Ancientissa ei osunut
    "inferno",       # [havaittu] palava alue, jonka molotov/incgrenade jättää
    # planted_c4 = istutetun pommin räjähdysvahinko. Pommi räjähtää vasta
    # kierroksen lopussa, joten se ei voi olla mielekäs *ensimmäinen* kontakti.
    # Jos se olisi kierroksen ainoa ristiinpuolinen vahinko, ensikontaktin
    # näytepiste laskeutuisi kierroksen viimeiselle sekunnille ja väittäisi
    # sitä "ensikontaktin asetelmaksi". [havaittu] [lisätty katselmuksessa]
    "planted_c4",
]

# Jos player_hurt-tapahtumaa ei löydy, käytetään ensimmäistä player_deathia.
# [spine] AD-5.
first_contact_fallback_death = true

# --- Räjähdysalue pistepilvestä (Story 2.9) ---
#
# Kranaatilla ei ole last_place_name-kenttää, joten räjähdyksen alue on
# johdettava koordinaateista. Menetelmä on PISTEPILVI: parse kokoaa demon
# omista tickeistä ruudukon siitä, missä pelaajat ovat kartalla oikeasti
# seisoneet ja mikä alue kussakin kohdassa on (last_place_name on pelin oma
# totuus), ja räjähdys nimetään lähimmän ruudun alueella. Ruudukko
# kirjoitetaan parsed/<map_demo_id>/callouts.parquet-tauluun, jotta johdettu
# alue on tarkistettavissa demoa vasten.
#
# MIKÄ POISTUI. Story 2.2 johti alueen LÄHIMMÄSTÄ ELOSSA OLEVASTA PELAAJASTA.
# Se ei ollut epätarkka vaan rakenteellisesti väärä: savu heitetään sinne,
# missä ketään ei ole -- juuri siksi, että se estää näkyvyyden ja pakottaa
# rotaatioita. Proxy mittasi päinvastaista kuin piti. Menetelmää ei jätetty
# rinnalle varalähteeksi: kaksi menetelmää tekisi rivistä tulkitsemattoman.
#
# MIKSI NIMI ON YHÄ area_snap_units. Sana "snap" on menetelmän jäänne, ja
# samoin EVENTS-taulun sarake snap_distance. Nimiä EI vaihdettu, vaikka
# skeemaversio nousi ja arkisto parsitaan joka tapauksessa uudelleen: speksi
# nimeää molemmat säilytettäviksi (Code Map pyytää "area_snap_units
# uudelleenkalibroituna" ja "EVENTS.snap_distance docstring"), eli nimet ovat
# jaettua sanastoa eivätkä toteutuksen yksityiskohta. Lue "snap" siis
# merkityksessä "kiinnitys lähimpään ruutuun", ei "nappaus pelaajalta".
#
# Nämä neljä koskevat vain räjähdystä. Heiton alue luetaan heittäjän omasta
# m_szLastPlaceName-propista samalta tickiltä, eli se on havainto eikä arvio;
# EVENTS-taulun area_source erottaa nämä kaksi ja snap_distance kertoo arvion
# etäisyyden rivikohtaisesti.

# Pistepilven ruudun särmä pelin yksiköissä.
#
# [mitattu 2026-08-30, Ancient_vs_kaljukostaja ja Nuke_vs_imuaijat]
# Mediaanietäisyys lähimpään ruutuun ja osuus 256 yksikön sisällä:
#
#   ruutu   z-paino/toleranssi   Ancient          Nuke
#     32          1 / 0          20 -- 89,8 %     20 -- 98,8 %
#     32          2 / 0          30 -- 86,5 %     31 -- 98,3 %
#     32          1 / 72         15 -- 91,8 %     14 -- 99,0 %   <- valittu
#     32          2 / 72         15 -- 89,0 %     14 -- 98,8 %
#     64          1 / 72         29 -- 93,2 %     26 -- 99,3 %
#    128          1 / 72         57 -- 90,5 %     47 -- 99,0 %
#
# RUUTU 32 EI OLE PARAS KATTAVUUDELTAAN. Ruutu 64 osuu kynnyksen sisään
# hieman useammin (Ancient 93,2 % vs. 91,8 %), koska karkeampi ruudukko
# kurottaa kauemmas. Valinta on silti 32, koska mediaanietäisyys puolittuu
# (15 vs. 29): pieni etäisyys on se, mikä tekee nimetystä alueesta
# todennäköisesti oikean, kun taas kattavuuden viimeiset prosentit ovat juuri
# niitä räjähdyksiä, jotka ovat kaukana kaikesta. Väärä alue on pahempi kuin
# puuttuva.
#
# Ruutuja on 32:lla noin 7 700-10 500 per demo, ja aluemäärä on sama kaikilla
# ruutukoilla (Ancient 18, Nuke 29): hienompi ruudukko ei pilko alueita vaan
# tarkentaa reunoja.
#
# Sallittu väli on 8-1024 yksikköä. Alaraja on suorituskykyraja eikä
# makuasia: ruutu 1 tuottaisi luokkaa miljoona ruutua, ja lähimmän haku on
# ristiintulo pisteiden ja ruutujen välillä. Yläraja 1024 on 32 pelaajan
# leveyttä -- sitä karkeampi ruudukko ei enää erottele alueita.
#
# Arvon muuttaminen mitätöi parsinnan tuloksen ([parse]-osio on osa
# parametrihashia), eli demot parsitaan uudelleen.
callout_grid_units = 32

# Pystyeron painokerroin, kun räjähdykselle etsitään lähintä ruutua.
#
# Kerroskartta vaatii sen: Nukella alakerran ruutu on ylhäältä katsoen aivan
# vieressä mutta eri alueella, ja ilman painoa yläkerran savu saa alakerran
# alueen. 0 = ei painoa (pystyero jätetään huomiotta kokonaan).
#
# [mitattu 2026-08-30, molemmat Nuke-demot] Väärän kerroksen alueen saaneet
# yläkerran räjähdykset ja kynnyksen sisään osuvien osuus:
#
#   paino   väärä kerros (1-79f7 / Nuke_vs)   kattavuus (1-79f7 / Nuke_vs)
#     0            25 / 38                       99,8 % / 99,8 %
#     1             0 /  0                       99,1 % / 99,0 %   <- valittu
#     2             0 /  0                       97,8 % / 98,8 %
#     3             0 /  0                       97,4 % / 98,8 %
#
# MIKSI 1 EIKÄ 2. Paino 1 riittää kerrosten erottamiseen täydellisesti --
# nolla väärää molemmilla demoilla -- ja jokainen sitä suurempi paino maksaa
# kattavuutta ostamatta mitään mitattavaa. Mediaani on sama (15/14) painoilla
# 1, 2 ja 3. Aiempi oletus 2 valittiin ennen kuin painoa 1 oli verrattu
# toleranssin kanssa, ja vertailu kumosi sen.
callout_z_weight = 1.0

# Pystyero, joka on painotuksessa ILMAISTA -- painokerroin koskee vain sen yli
# menevää osaa: max(0, |dz| - tämä) * callout_z_weight.
#
# MITTAUS MUUTTI SUUNNITELMAN. Pelkkä z-paino 2 ilman toleranssia on HUONOMPI
# kuin ei painoa lainkaan (Ancient mediaani 30 vs. 20, Nuke 31 vs. 20). Syy on
# ilmeinen jälkikäteen: pistepilvi tallentaa PELAAJAN sijainnin, mutta
# kranaatti räjähtää mistä tahansa lattian ja pään väliltä -- savu ilmassa,
# molotov lattialla. Pystysuora rangaistus osuu siis normaaliin tapaukseen.
# Kun z-erosta vähennetään pelaajan korkeus ennen painotusta, mediaani putoaa
# 20:stä 15:een (Ancient) ja 14:ään (Nuke).
#
# TOLERANSSI ON SYMMETRINEN, ja se on mitattu eikä oletettu. Vapaus vain
# ylöspäin (savu leijuu, joten alaspäin ei tarvita vapautta) kuulostaa
# oikealta mutta on mitattuna huonompi: painolla 1 mediaani nousee
# Ancientilla 15 -> 17 ja Nukella 14 -> 19, eikä kattavuus parane lainkaan
# (91,8 % ja 99,0 % molemmilla). Syy on molotov ja palo, jotka ovat pelaajan
# jalkojen tasolla tai sen alla rinteessä -- ja rappusissa pelaajan
# vertailupiste voi olla kumpaa tahansa puolta räjähdystä.
#
# 72 = PELAAJAN KORKEUS pelin yksiköissä, ei sovitettu luku.
callout_z_tolerance_units = 72

# Enimmäisetäisyys pelin yksiköissä, jolta räjähdyksen alue saa tulla lähimmästä
# pistepilviruudusta. [spine] AD-5; tämä on vastaus Open Question 4:ään
# (last_place_name-alueiden karkeus ja räjähdysalueen johtaminen).
#
# PAKOLLINEN ASETUS, ei valinnainen. Speksin Always-sääntö on "etäisyyskynnys
# säilyy", ja ilman arvoa jokainen räjähdys saisi alueen etäisyydestä
# riippumatta: pistepilvestä lähin ruutu löytyy AINA, joten kynnyksetön
# kattavuus olisi aina 100 % eikä se olisi kattavuutta vaan mittarin
# puuttuminen. Mitattu maksimietäisyys on 1 074 yksikköä.
#
# ETÄISYYS ON PAINOTETTU samoin kuin nimeäminen (ks. kaksi edellistä), eli se
# ei ole euklidinen etäisyys vaan se luku, jolla lähin ruutu valittiin.
#
# [kalibroitu 2026-08-30, kaikki kuusi demoa, 2 544 räjähdystä,
#  ruutu 32 / paino 1 / toleranssi 72]
# Osuma = räjähdys, jonka lähin ruutu on kynnyksen sisällä:
#
#   kynnys   osuu         osuus
#      64    2281/2544    89,7 %
#     128    2351/2544    92,4 %
#     192    2397/2544    94,2 %
#     256    2428/2544    95,4 %   <- valittu
#     320    2460/2544    96,7 %
#     384    2481/2544    97,5 %
#     512    2506/2544    98,5 %
#    1024    2543/2544    100,0 %
#
# Demokohtaisesti kynnyksellä 256: Ancient_vs_kaljukostaja 91,8 %,
# Anubis_vs_ryhmarama 93,5 %, Nuke_vs_imuaijat 99,0 %,
# inferno_vs_ryhmarama 98,4 %, testidemot 89,8 % (Ancient) ja 99,1 % (Nuke).
# Vertailukohta: EDELLINEN MENETELMÄ (lähin elossa oleva pelaaja, kynnys 500)
# jätti neljästä liigademosta 42 % räjähdyksistä ilman aluetta (722/1 716).
#
# MIKSI 256 EIKÄ 512. Kynnys on tarkkuuden ja kattavuuden vaihtokauppa, ja
# 256:n ja 512:n välissä voitetaan 3,1 prosenttiyksikköä. 256 yksikköä on
# kahdeksan ruutua eli noin kahdeksan pelaajan leveyttä: sitä kauempana oleva
# räjähdys ei ole "reunalla" vaan paikassa, jossa kukaan ei ole seissyt --
# radan ulkopuolelle heitetty savu tai kierroksen päättymisen jälkeen
# räjähtänyt molotov. Ne jäävät kynnyksen taakse aluetta vaille, mikä on oikea
# lopputulos. Väärä alue on pahempi kuin puuttuva.
#
# Ajo mittaa tämän joka kerta uudelleen: rivit "Räjähdysalue" ja
# "Etäisyys ruutuun" kertovat kattavuuden ja jakauman ilman uutta kalibrointia.
area_snap_units = 256

# Kalustolaskurilla players_armed_buy_end ei ole asetusta: se on havainto
# (panssari ja ase hallussa), ja aseluettelo on src/pappascout/constants.py:ssä.
# Story 1.5:n armed_player_equip_min poistui -- ks. domain/models.py:n
# REMOVED_SETTINGS, joka kertoo sen vanhaan tiedostoon jättäneelle mitä tehdä.
#
# Panssarilaskurilla players_armored_buy_end ei myöskään ole asetusta: se on
# sama lukema eri ehdolla (m_ArmorValue > 0), eikä kynnys tulisi kysymykseen --
# "panssaria on" ei ole säädettävissä. Se on eri luku kuin yllä: molemmat ovat
# ROUNDS-taulussa, aseistetut ovat panssaroitujen osajoukko, ja
# pistoolikierroksella yllä oleva on käytännössä 0 (800 $ ei riitä sekä
# kevlariin että parannettuun aseeseen). Molemmat ovat hallussapitoa eivätkä
# ostoja: panssari säilyy kierroksen yli hengissä selvinneellä. Poikkeus on
# pistoolikierros, jolla puoliaika alkaa puhtaalta pöydältä.


[thresholds]
# Pistoolikierrokset tunnistetaan kierrosnumerosta, ei rahasta. MR12:ssa
# kierrokset 1 ja 13. Puukkokierros ei saa kierrosnumeroa. [addendum] [spine] AD-3
pistol_rounds = [1, 13]

# Säännönmukaisia kierroksia 24 (2 x 12). Tämän yli menevä kierros on jatkoaikaa
# eikä sitä luokitella talouden perusteella. [addendum] [spine] AD-3
regulation_rounds = 24

# --- Varustearvorajat, dollaria PER PELAAJA ---

# Täysi osto: kivääri + kevlar (+kypärä) + kaksi utilitya. T:llä AK 2700 + 1000 +
# ~500 ~= 4200, CT:llä M4 2900 + kevlar 650 + ~500 ~= 4050. CT ostaa usein
# kevlarin ilman kypärää, eikä kypärän puute saa pudottaa kierrosta pois
# full-luokasta.
#
# Tämä raja tunnistaa täyden oston SUORAAN varustearvosta. Se ei ole ainoa
# reitti full-luokkaan: voiton jälkeen kaikki normaalit ostot ovat full
# (sääntö S1) riippumatta varustearvosta. Kalibrointiaineiston full-riveistä
# viisi (5330-5680) ylittää tämän rajan, ja kaksi (kierros 2 CT = 3200 ja
# kierros 14 T = 3550) jää sen alle -- ne päätyvät fulliksi voiton jälkeisen
# säännön kautta. Rajaa EI siis lasketa niiden alle: se erottaa "osti
# selvästi täyden" hävityn kierroksen jälkeen, ja aineiston korkein häviön
# jälkeinen ostokierros on 2910 (kierros 20 T, force).
# [addendum] käyttäjän linjaus 2026-08-28 [kalibroitu 2026-08-29]
full_equip_min = 4000

# Matala varustearvo VOITON jälkeen on poikkeama (save-virhe), ei eco.
# Aineiston matalin VOITON jälkeinen varustearvo on 3200 (kierros 2 CT), joten
# 2000 jättää 1200 $ marginaalin eikä yksikään havaittu normaali osto putoa
# poikkeamaksi. Rajan alapuolelle ei ole havaintoa: aineistossa ei ole
# yhtäkään voiton jälkeistä save-kierrosta, joten alaraja nojaa siihen, että
# 2000 $/pelaaja on liian vähän ollakseen osto.
# [addendum] heuristiikka 2 [spine] AD-4 vaihe 5 [kalibroitu 2026-08-29]
anomaly_equip_max_after_win = 2000

# --- Raharajat, dollaria PER PELAAJA ---

# Hävityn kierroksen jälkeen: force ja puoliosto edellyttävät molemmat, että
# joukkue oikeasti osti tällä kierroksella (equip_buy_end -
# equip_round_start). Säästetty ase ei ole ostos (sääntö S3), joten pelkkä
# korkea varustearvo ei riitä.
#
# HAVAITTU raja. Aineistossa forcet ostivat 1840-2710 ja ecot 120-950 per
# pelaaja, eli välissä 950-1840 ei ole yhtään havaintoa. Valittu 1500 on
# tuossa välissä ja jättää marginaalin molempiin suuntiin (550 ecoihin, 340
# forceihin) -- se ei ole välin keskikohta (1395) eikä sen tarvitse olla,
# olennaista on ettei kumpikaan havaittu joukko ole lähellä. 1500 $ on myös
# se summa, jolla saa kevlarin ja paremman pistoolin.
# [addendum] heuristiikka 1b [kalibroitu 2026-08-29]
force_buy_min = 1500

# --- Puolioston kaksi ehtoa (Story 1.10) ---
#
# Veetin määritelmä on kaksisuuntainen: "Puoliosto ei ole force silloin kun
# seuraavalla kierroksella mahdollistetaan normaali osto, ja ei ole eco kun
# käytössä on tarpeeksi arvoa." MOLEMPIEN ehtojen on täytyttävä.
#
# Ehto A erottaa puolioston ECOSTA, ehto B FORCESTA. Ne mittaavat eri asiaa:
# A katsoo tälle kierrokselle ostettua kalustoa, B seuraavan kierroksen
# ostovoimaa.
#
# MITÄ AINEISTO SANOO -- ja mitä se ei sano. Kuudessa demossa on 23 hävityn
# kierroksen jälkeistä ostokierrosta, ja poistunut kiinteä raja
# force_money_left_max antaisi niistä JOKAISELLE saman luokan kuin ehdot A ja
# B. Yksikään mitattu kierros ei siis vielä erota näitä sääntöjä toisistaan.
# Ero näkyy vasta epätasaisella jakaumalla, ja säännön peruste on käyttäjän
# oma määritelmä, joka on pelaajakohtainen -- ei mittaus, joka olisi kumonnut
# edellisen säännön.


# EHTO A: vähintään tämän monella pelaajalla oli panssari ja jokin parannettu
# ase ostoajan lopussa (havainto players_armed_buy_end). Alle sen kierrosta ei
# oikeasti pelata, ja kyseessä on eco vaikka rahaa olisi liikkunut.
#
# Veetin oma raja: "vähintään kolmella pelaajalla on kevlar ja jokin
# parannettu ase -- parempi pistooli, SMG tai halpa kivääri".
#
# EI HAVAINTOA. Aineiston ainoa vähän aseistettu kierros (Ancient 21 T, 2/5)
# ratkeaa jo ostorajalla force_buy_min eikä koskaan saavuta ehtoa A, joten
# tämä kynnys ei ole kalibroitu mitään vasten. Se on käyttäjän lausuma sääntö
# ja pysyy sellaisena, kunnes nähdään kierros, jolla ostettiin kunnolla mutta
# aseistettuja oli alle kolme.
# [lausuttu 2026-08-29, ei havaintoa]
armed_players_min = 3

# EHTO B: montako pelaajaa pystyy normaaliin ostoon SEURAAVALLA kierroksella.
# Pelaaja pystyy, jos hänen oma saldonsa ostoajan lopussa plus häviöbonus
# yltää arvoon normal_buy_money_min. Summa katkaistaan [economy].max_moneyyn.
#
# normal_buy_money_min on YHDEN PELAAJAN OMA SALDO, ei joukkueen keskiarvo.
# Tämä on koko säännön syy: joukkue jolla yhdellä on 5 000 ja neljällä nolla
# saa saman keskiarvon kuin joukkue jolla kaikilla on 1 000, mutta
# edellisessä neljä viidestä ei voi ostaa mitään. Keskiarvo antaa myös
# mahdottomia lukuja: kierros 19 CT näytti "30 $/pelaaja", kun todelliset
# saldot olivat 0, 0, 50, 50, 50 -- kaikki hinnat ovat viidenkymmenen
# monikertoja, joten 30 ei voi olla kenenkään saldo.
#
# 4000 $ on sama luku kuin full_equip_min ja samasta syystä: kivääri +
# kevlar (+kypärä) + pari utilitya maksaa sen. Häviöbonus luetaan
# [economy].loss_bonus_steps -portaista loss countin mukaan (1400-3400 $)
# INDEKSILLÄ loss_count: laskuri kuvaa tilaa kierrokseen mentäessä, ja juuri
# se porras maksetaan, jos kierros hävitään.
#
# HAVAITTU, marginaali mitattu molempiin suuntiin: kierroksella 6 rikkaimman
# pelaajan ostovoima on 1750 + 1900 = 3650 (marginaali 350 alaspäin, force)
# ja kierroksella 10 köyhimmän 800 + 3400 = 4200 (marginaali 200 ylöspäin,
# puoliosto). Molemmat ylittävät testien MIN_MARGINin 200 $.
# [kalibroitu 2026-08-29, inferno_vs_ryhmarama kierrokset 6 ja 10]
normal_buy_money_min = 4000

# Montako pelaajaa ehdon B on koskettava. EI HAVAINTOA: kierroksella 6
# ostokykyisiä on 0/5 ja kierroksella 10 kaikki 5/5, joten mikä tahansa arvo
# väliltä 1-5 tuottaisi samat tuomiot. 3 on valittu symmetriseksi ehdon A
# kanssa -- "puolet joukkueesta ja yksi päälle".
# [päätelty 2026-08-29, odottaa havaintoa]
normal_buy_players_min = 3

# --- Loss count ---
# Puoliaika alkaa arvosta 1 (pistoolihäviö 1900 $). Voitto laskee laskuria
# yhdellä portaalla, ei nollaa. Rajat 0-4. [addendum] [spine] AD-4
loss_count_half_start = 1
loss_count_min = 0
loss_count_max = 4

# --- Joukkueidentiteetti ja rosterikynnys ---
# Lineupit liitetään samaan team_keyhin, kun yhteisiä pelaajia on vähintään 3.
# [spine] AD-3, AD-6
team_identity_min_common = 3

# Rosterikynnys arvioidaan per kartta: 5/5 vakiorosterista tai vähintään 4/5 +
# ulkopuolinen. Pappaliigassa saa tehdä enintään 2 vaihtoa karttojen välissä.
# [spine] AD-6 [domain]
roster_size = 5
roster_min_regulars = 4

# --- Otanta ja poikkeamat ---
# Alle tämän kierrosmäärän otanta merkitään raportissa pieneksi. [spine] AD-3
small_sample_rounds = 3

# Stack = vähintään 4 pelaajaa samalla alueella samassa näytepisteessä.
# [spine] AD-10
#
# KÄYTTÄMÄTÖN Story 2.5:stä lähtien. Sääntö on mitattu mahdottomaksi pelin
# nykyisellä aluejaolla: neljä puolustajaa samalla env_cs_place-alueella
# tuotti 0 osumaa 93 kierroksesta, koska peli jakaa sitet useaan alueeseen
# (Ancientin B on Alley + BombsiteB + SideEntrance). Arvo jää tähän, koska
# sääntö on kirjattu omaksi tarinakseen aluejaon lisäyksen kanssa
# (deferred-work.md); poistaminen vaatisi migraatioviestin.
stack_min_players = 4

# --- Poikkeamasäännöt (Story 2.5) ---
# Kaksi sääntöä, joilla on YHTEINEN orientaatioehto. Kumpikaan ei ole toisen
# "tiukempi muoto": crunch on tiukempi suunnista mutta löysempi
# kierrostyypistä, joten osumajoukot leikkaavat toisiaan eikä kumpikaan
# sisällä toista (mitattu: MatureMayhem Anubis k10 on täysi osto, jolla
# etenemistä ei ole olemassa).
#
# Jokainen arvo alla on MITATTU eikä valittu. Mittaus on kahdeksasta demosta
# ja kahdesta eri joukkueesta; mitatut luvut ovat tässä kommentissa, jotta ne
# ovat tarkistettavissa ilman lähdedokumenttia. Koko perustelu on
# kalibrointi-ct-eteneminen.md:ssä, joka EI ole tässä repossa vaan
# projektikansiossa _bmad-output/implementation-artifacts/ (OneDrive).
# [kalibroitu] [spine] AD-10
#
# Alue on "T:n aluetta siinä demossa", jos sen elossa-havainnoista
# aikanäytepisteillä vähintään tämä osuus tulee T-puolelta. Osuus lasketaan
# demon SUODATTAMATTOMASTA näytepistetaulusta (molempien joukkueiden rivit) --
# subjektin omilla riveillä laskettuna jokainen tosi positiivinen katoaa,
# koska poikkeama syö oman havaitsemisensa (mitattu: 0,88 -> 0,79,
# 0,85 -> 0,75, 0,84 -> 0,75, ja juuri ne kolme aluetta tuottivat kaikki
# oikeat osumat).
#
# 0,80 EIKÄ 0,70: Nuken piha (Outside) saa T-osuuden 0,70 (211/302), ja se on
# aidosti molempien aluetta -- kynnys 0,70 tekisi jokaisesta pihalla olevasta
# CT:stä "etenemisen". Ainoa lisäosuma 0,70:llä on yksi pelaaja ilman
# vastinetta Veetin omassa analyysissä.
#
# Alaraja on yli 0,5 (ThresholdSettings.MajorityShare): kynnys kertoo
# kummalle puolelle alue KUULUU, ja arvolla 0,5 tai alle alue voisi olla
# molempien -- arvolla 0,0 jokainen kartan alue olisi T:n aluetta.
advance_t_share = 0.80

# Alueelta vaaditaan vähintään näin monta elossa-havaintoa, ennen kuin sillä
# on orientaatio lainkaan. Vertailu on >=, eli TASAN 20 havainnon alue on
# mukana; alue, joka ALITTAA rajan, ei ole T:n eikä CT:n aluetta --
# orientaatiota ei arvata ohuesta havainnosta.
#
# Mitattu: 20 erottaa kartan pelatut alueet (10-12 demoa kohden) satunnaisista
# läpikuluista. Kynnykset 10 ja 20 antavat aineistossa identtisen tuloksen; 5
# toisi mukaan alueen, jonka T-osuus 0,83 nojaa viiteen havaintoon kuudesta
# (Ancientin Ramp).
advance_area_min_observations = 20

# Poikkeama luetaan vain näytepisteiltä, jotka ovat enintään näin kauan
# kierroksen ankkurista. Raja on MITATTU eikä valittu: se pudottaa kaksi
# epävarmaa kierrosta (MatureMayhem Ancient k2 ja k7, kaksi CT:tä T:n spawnin
# puolella 45 s kohdalla -- yhtä hyvin selitettävissä voitetulla kierroksella
# kuin suunnitelmalla) eikä yhtäkään varmaa: jokainen 6-30 s välillä merkitty
# kierros osuu jo aiemmalla näytepisteellä.
#
# Rajat: yli 0,0 ja enintään 60,0 (MAX_ADVANCE_SAMPLE_SECONDS). Lisäksi arvon
# on oltava vähintään pienin [parse].snapshot_seconds -piste, ja sen tarkistaa
# Settings._check_sections_agree: pienempi arvo vaientaisi MOLEMMAT säännöt
# pysyvästi, ja raportti väittäisi silloin "ei poikkeamia" havaintona vaikka
# yhtäkään näytepistettä ei tutkittu.
advance_max_sample_s = 30.0

# Montako CT-pelaajaa T:n alueella riittää etenemiseksi. Veeti 2026-08-31:
# "yksi riittää" -- raportti näyttää pelaajamäärän ja otannan, joten lukija
# arvioi itse onko kyse lurkkerista vai sattumasta. Kuudesta merkitystä
# kierroksesta neljä osuu yhden pelaajan havainnolla. [lausuttu]
#
# Yläraja on kentällä olevien määrä (5), ei rosterin koko: rosterissa voi olla
# vaihtopelaajia, mutta kuusi pelaajaa alueella on mahdoton ehto.
advance_min_players = 1

# Crunchin kaksi lisäehtoa. Veetin määritelmä 31.8.: "pusketaan CT puolella T
# puolen alueelle, joka on tyypillisesti aina T puolen hallussa eli lobbyyn
# kahdesta tai useammasta suunnasta samaan aikaan." Kaksi pelaajaa kahdesta
# suunnasta on siis jo crunch. Lähtösuunta on pelaajan oma edellinen alue eli
# havainto -- ei karttageometriaa eikä aluenaapuruustaulua.
#
# Kynnyksiä ei tarvinnut tiukentaa: oikealla määritelmällä osumia on 5
# kierroksella 93:sta (5 %), eli poikkeaman kokoluokka. Aiemmin harkitut
# tiukennukset (>= 3 pelaajaa, kohde on site) olivat vastaus VÄÄRÄN
# määritelmän ylilaukeamiseen, kun sääntö mittasi T:n executea.
#
# crunch_min_sources alaraja on 2 eikä 1: crunch on määritelmällisesti
# saapumista USEASTA suunnasta, ja arvolla 1 sekä sääntö että raportin
# lukuohje väittäisivät jotain, mitä koodi ei enää vaadi. Suuntia ei myöskään
# voi vaatia enemmän kuin pelaajia -- jokainen suunta tarvitsee oman
# pelaajansa. Näiden kahden ja advance_min_players:in välillä EI ole
# järjestystä, koska crunch ei ole etenemisen tiukempi muoto.
crunch_min_players = 2
crunch_min_sources = 2


[aggregate]
# Vain aggregate-vaiheen omat arvot (AD-3).
#
# MIKSI OMA OSIO EIKÄ [thresholds]. classify laskee parametrihashinsa koko
# [thresholds]-osiosta, koska osittainen hash vaatisi listan siitä, mitä
# kenttiä säännöt sattuvat lukemaan -- ja se lista vanhenisi hiljaa. Hinta
# on, että mikä tahansa lisäys sinne mitätöi jokaisen luokitellun demon.
# classify ei lue tämän osion arvoja lainkaan, joten niiden säätäminen ei saa
# pakottaa uudelleenluokittelua. Osiointi tekee siitä rakenteellisen: vaihe
# näkee vain oman osansa.

# Utilityn aikaikkunoiden rajat sekunteina kierroksen alusta (Story 2.3).
#
# Kranaatilla on tarkka t_s, näytepisteillä ei, joten heitot niputetaan
# ikkunoihin: nämä rajat tuottavat lokerot 0-5, 5-10, 10-20 ja 20+ (raja
# kuuluu aina ylempään lokeroon). Ilman niputusta jokainen heitto olisi oma
# ainutkertainen havaintonsa eikä yksikään kuvio toistuisi.
#
# MIKSI ASETUS EIKÄ KOODI: "insta mid talo savu" ja kolmekymmentä sekuntia
# myöhemmin heitetty savu ovat eri asia, mutta se missä kohtaa raja kulkee on
# pelaajan tulkinta eikä mittaus. Rajojen siirtäminen ajaa vain aggregoinnin
# uudelleen -- ei parsintaa eikä luokittelua.
#
# EI HAVAINTOA. Ensimmäinen lokero 0-5 s vastaa tavoiteanalyysin sanaa
# "insta"; loput ovat karkea porrastus, jota aineisto ei ole vielä koetellut.
# [lausuttu 2026-08-30, odottaa havaintoa]
utility_seconds_buckets = [5.0, 10.0, 20.0]


