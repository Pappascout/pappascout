[parse]
# Näytepisteet sekunteina viimeisestä round_freeze_endistä.
# ~6 s CT-suunta näkyy, ~10-15 s T rush erottuu defaultista, 25-30 s ja 45 s
# näyttävät kierroksen kehityksen. [domain] [spine] AD-3 oletus [6, 15, 30, 45].
# Arvojen on oltava positiivisia, äärellisiä, keskenään eri suuria ja enintään
# kierroksen keston (115 s) mittaisia; lataus tarkistaa tämän.
snapshot_seconds = [6.0, 15.0, 30.0, 45.0]

# Ostoajan pituus sekunteina freezetimen päättymisestä. Talousluvut luetaan
# ostoajan lopusta, ei freezetimen lopusta. Mittauspiste on
#
#   max(freezetimen loppu,
#       min(freezetimen loppu + tämä,
#           kierroksen ensimmäistä kuolemaa EDELTÄVÄ tick,
#           kierroksen loppu))
#
# Kuolemaa EDELTÄVÄ tick eikä kuoleman tick: kuolleen tavaraluettelo on jo
# tyhjä ja panssari nolla, joten kuolintickiltä luettuna joukkueesta katoaisi
# yhden pelaajan koko kalusto. Uloin max on alaraja, joka estää mittauspistettä
# valumasta freezetimen sisään, jos kuolema osuu heti ankkurin jälkeen.
#
# MIKSI 20 -- LINJAUS, JOKA ON YHTEENSOPIVA MITTAUKSEN KANSSA.
# Käyttäjä 2026-08-29: "Buy time on mielestäni 20 sekuntia jokaisen kierroksen
# alusta eli freezetimen päätyttyä." Sana "mielestäni" on siinä, joten tätä ei
# esitetä todistettuna pelin sääntönä vaan linjauksena, jonka mittaus tukee:
# viidestä liigademosta (106 kierrosta, 52:lla ostettiin vielä freezetimen
# jälkeen) ostaminen oli valmis 20 sekunnin kohdalla 100 %:ssa. Mittaus on
# yhteensopiva 20 sekunnin ostoajan kanssa muttei todista sitä -- pisin
# havaittu osto oli 19,4 s, eikä aineisto voi kertoa mitä 20,5 sekunnin
# kohdalla olisi tapahtunut.
#
# Linjaus on silti vahvempi peruste kuin kalibroitu arvo, ja kolmesta syystä:
#
#  1. Se ei vaadi kalibrointia eikä vanhene uuden aineiston myötä. Viisi
#     sekuntia kattaisi 85 % ja olisi käyttäjän oma arvio, mutta se olisi luku
#     joka pitäisi säätää joka kerta kun uusi demo tuo pidemmän oston.
#     Kertymä: 3 s 62 %, 5 s 85 %, 8 s 92 %, 15 s 98 %, 20 s 100 %.
#     Mediaani 2,1 s, p90 5,8 s, max 19,4 s.
#  2. Se ei maksa mitään. Yhdelläkään 106 kierroksesta ei kuolla ennen kuin
#     ostaminen loppuu, joten pidempi ikkuna ei tuo roskaa mukanaan. Ajo
#     mittaa tämän joka kerta uudelleen ja kertoo tuloksen rivillä "Kuoleman
#     katkaisu" -- jos ikkuna joskus alkaa maksaa, se ei jää huomaamatta.
#  3. Hännän kahdeksan kierrosta (5,1 · 5,2 · 5,8 · 6,1 · 11,0 · 11,3 · 13,5 ·
#     19,4 s) ovat juuri ne kiinnostavat: kymmenen sekunnin miettiminen
#     tarkoittaa vaikeaa ostopäätöstä forcen ja säästön väliltä, mikä on
#     scoutingin kannalta arvokkaampaa kuin rutiinitäysosto.
#
# Mittauspiste on **yksi tick koko kierrokselle**, ei pelaajakohtainen:
# mittaushetkellä kukaan ei ole vielä kuollut eikä siis ehtinyt pudottaa
# asettaan, joten kaksoislaskenta (joukkuekaveri poimii vainajan kiväärin) on
# rakenteellisesti poissuljettu.
#
# Kuoleman katkaisu on normaali polku eikä poikkeus: kuudessa demossa
# (134 pelattua kierrosta) se osuu 69 kierrokseen eli 51 %:iin, joten
# efektiivinen mittaushetki on usein 10-20 s eikä 20 s. Ajon tuloste kertoo
# todellisen jakauman kierroslistan kanssa samasta taulusta.
#
# Arvon muuttaminen mitätöi parsinnan tuloksen ([parse]-osio on osa
# parametrihashia), eli demot parsitaan uudelleen. Sallittu väli on 0-40 s;
# 0 tarkoittaa "mittaa freezetimen lopusta" eli tätä edeltänyttä
# käyttäytymistä.
# [domain] käyttäjän linjaus 2026-08-29 [mitattu viidestä liigademosta]
buy_window_seconds = 20.0

# Ensikontakti = ensimmäinen player_hurt, jossa tekijä on vastapuolella ja ase ei
# ole utility. Nämä aseet eivät siis kelpaa ensikontaktiksi. [spine] AD-5.
#
# Nimet on luettu demoparser2:n player_hurt-tapahtuman weapon-kentästä
# (Story 2.1). Ancient-demossa esiintyivät: ak47, awp, deagle, elite, famas,
# fiveseven, galilar, glock, hegrenade, hkp2000, inferno, knife, m4a1, mac10,
# molotov, mp7, mp9, nova, p250, planted_c4, smokegrenade, ssg08, tec9.
#
# Merkintä [havaittu] = ase esiintyy Ancient-demon vahinkotapahtumissa.
# Merkintä [oletettu] = nimi on CS2:n vakionimi, mutta tällä aseella ei ollut
# Ancientissa yhtään vahinkotapahtumaa, joten kirjoitusasua ei ole todennettu.
# Väärä kirjoitusasu ei kaada mitään -- se vain jättää aseen poissulkematta,
# jolloin utilityosuma voisi laskea ensikontaktiksi.
first_contact_exclude_weapons = [
    "hegrenade",     # [havaittu]
    "flashbang",     # [oletettu] flash tekee vahinkoa vain harvoin
    "smokegrenade",  # [havaittu]
    "decoy",         # [oletettu] harjoitusgranaatti, vahinko poikkeuksellista
    "molotov",       # [havaittu] T-puolen polttopullo
    "incgrenade",    # [oletettu] CT-puolen vastine; Ancientissa ei osunut
    "inferno",       # [havaittu] palava alue, jonka molotov/incgrenade jättää
    # planted_c4 = istutetun pommin räjähdysvahinko. Pommi räjähtää vasta
    # kierroksen lopussa, joten se ei voi olla mielekäs *ensimmäinen* kontakti.
    # Jos se olisi kierroksen ainoa ristiinpuolinen vahinko, ensikontaktin
    # näytepiste laskeutuisi kierroksen viimeiselle sekunnille ja väittäisi
    # sitä "ensikontaktin asetelmaksi". [havaittu] [lisätty katselmuksessa]
    "planted_c4",
]

# Jos player_hurt-tapahtumaa ei löydy, käytetään ensimmäistä player_deathia.
# [spine] AD-5.
first_contact_fallback_death = true

# Enimmäisetäisyys pelin yksiköissä, jolta utility-tapahtuman alue saa napata
# lähimmän elossa olevan pelaajan alueen. [spine] AD-5, Open Question 4.
#
# Kranaatilla ei ole last_place_name-kenttää, joten alue on johdettava
# koordinaateista. Tämä on sen ainoa säädin: liian suuri arvo antaa
# naapurialueen calloutin, liian pieni jättää alueen tyhjäksi. **Väärä alue on
# pahempi kuin puuttuva**, joten arvo on tarkoituksella varovainen. Jos avain
# poistetaan, alue jää aina nulliksi mutta koordinaatit tallentuvat silti.
#
# Raja koskee **vain räjähdystä**. Heiton alue luetaan heittäjän omasta
# m_szLastPlaceName-propista samalta tickiltä, eli se on havainto eikä arvio;
# EVENTS-taulun area_source erottaa nämä kaksi toisistaan ja snap_distance
# kertoo arvion etäisyyden rivikohtaisesti.
#
# Mitattu Ancient-demon 374 lentoradasta (Story 2.2). Kaikki 374 ovat mukana
# kalibroinnissa, myös se yksi, joka lähtee kierroksen ratkeamisen jälkeen eikä
# siksi päädy taulun 373 kranaatin joukkoon:
#   - heittopiste: lähin elossa oleva pelaaja on heittäjä itse 374/374
#     kerralla, ja etäisyys on 38-91 yksikköä (kranaatti lähtee kädestä). Tämä
#     mittaus perusteli sen, että heittoalue kannattaa lukea suoraan
#     heittäjältä eikä napsauttaa lainkaan.
#   - räjähdyspiste: mediaanietäisyys lähimpään pelaajaan on 532 yksikköä.
#     Rajalla 500 alue saadaan 178/374 tapahtumalle, ja niistä 76 %:ssa kaikki
#     rajan sisällä olevat pelaajat ovat samalla alueella. Rajalla 1000
#     kattavuus nousee 91 %:iin mutta yksimielisyys romahtaa 35 %:iin -- silloin
#     "lähin pelaaja" ei enää kerro kranaatin aluetta vaan naapurin.
#
# [kalibroi] Arvo on Story 2.2:n mittaus kahdelta kartalta. Useampi kartta voi
# säätää sitä; snap_distance-sarake antaa aineiston siihen ilman uutta ajoa.
area_snap_units = 500

# Kalustolaskurilla players_armed_buy_end ei ole asetusta: se on havainto
# (panssari ja ase hallussa), ja aseluettelo on src/pappascout/constants.py:ssä.
# Story 1.5:n armed_player_equip_min poistui -- ks. domain/models.py:n
# REMOVED_SETTINGS, joka kertoo sen vanhaan tiedostoon jättäneelle mitä tehdä.


[thresholds]
# Pistoolikierrokset tunnistetaan kierrosnumerosta, ei rahasta. MR12:ssa
# kierrokset 1 ja 13. Puukkokierros ei saa kierrosnumeroa. [addendum] [spine] AD-3
pistol_rounds = [1, 13]

# Säännönmukaisia kierroksia 24 (2 x 12). Tämän yli menevä kierros on jatkoaikaa
# eikä sitä luokitella talouden perusteella. [addendum] [spine] AD-3
regulation_rounds = 24

# --- Varustearvorajat, dollaria PER PELAAJA ---

# Täysi osto: kivääri + kevlar (+kypärä) + kaksi utilitya. T:llä AK 2700 + 1000 +
# ~500 ~= 4200, CT:llä M4 2900 + kevlar 650 + ~500 ~= 4050. CT ostaa usein
# kevlarin ilman kypärää, eikä kypärän puute saa pudottaa kierrosta pois
# full-luokasta.
#
# Tämä raja tunnistaa täyden oston SUORAAN varustearvosta. Se ei ole ainoa
# reitti full-luokkaan: voiton jälkeen kaikki normaalit ostot ovat full
# (sääntö S1) riippumatta varustearvosta. Kalibrointiaineiston full-riveistä
# viisi (5330-5680) ylittää tämän rajan, ja kaksi (kierros 2 CT = 3200 ja
# kierros 14 T = 3550) jää sen alle -- ne päätyvät fulliksi voiton jälkeisen
# säännön kautta. Rajaa EI siis lasketa niiden alle: se erottaa "osti
# selvästi täyden" hävityn kierroksen jälkeen, ja aineiston korkein häviön
# jälkeinen ostokierros on 2910 (kierros 20 T, force).
# [addendum] käyttäjän linjaus 2026-08-28 [kalibroitu 2026-08-29]
full_equip_min = 4000

# Matala varustearvo VOITON jälkeen on poikkeama (save-virhe), ei eco.
# Aineiston matalin VOITON jälkeinen varustearvo on 3200 (kierros 2 CT), joten
# 2000 jättää 1200 $ marginaalin eikä yksikään havaittu normaali osto putoa
# poikkeamaksi. Rajan alapuolelle ei ole havaintoa: aineistossa ei ole
# yhtäkään voiton jälkeistä save-kierrosta, joten alaraja nojaa siihen, että
# 2000 $/pelaaja on liian vähän ollakseen osto.
# [addendum] heuristiikka 2 [spine] AD-4 vaihe 5 [kalibroitu 2026-08-29]
anomaly_equip_max_after_win = 2000

# --- Raharajat, dollaria PER PELAAJA ---

# Hävityn kierroksen jälkeen: force ja puoliosto edellyttävät molemmat, että
# joukkue oikeasti osti tällä kierroksella (equip_buy_end -
# equip_round_start). Säästetty ase ei ole ostos (sääntö S3), joten pelkkä
# korkea varustearvo ei riitä.
#
# HAVAITTU raja. Aineistossa forcet ostivat 1840-2710 ja ecot 120-950 per
# pelaaja, eli välissä 950-1840 ei ole yhtään havaintoa. Valittu 1500 on
# tuossa välissä ja jättää marginaalin molempiin suuntiin (550 ecoihin, 340
# forceihin) -- se ei ole välin keskikohta (1395) eikä sen tarvitse olla,
# olennaista on ettei kumpikaan havaittu joukko ole lähellä. 1500 $ on myös
# se summa, jolla saa kevlarin ja paremman pistoolin.
# [addendum] heuristiikka 1b [kalibroitu 2026-08-29]
force_buy_min = 1500

# Force ja puoliosto eroavat TASKUUN JÄTETYSTÄ rahasta (sääntö S2): force
# osti tyhjäksi, puoliosto jätti varaa seuraavalle kierrokselle.
#
# PÄÄTELTY raja, ei havaittu -- ainoa tällainen näistä kynnyksistä.
# Aineiston forceilla jäi taskuun 270 ja 750 per pelaaja, mutta aineistossa ei
# ole YHTÄÄN puoliostoa, joten rajan yläpuolta ei ole havaittu lainkaan.
# (Ecojen 2060-3090 ei ole oikea vertailujoukko: ne erottuvat jo siitä, ettei
# niissä ostettu, eivät tästä rajasta.) 1000 $ nojaa siihen, että sillä
# rahalla ei enää saa mitään merkittävää, ja jättää havaittuihin forceihin
# 250 $ marginaalin. Tämä raja on tarkoitus säätää uudelleen, kun ensimmäinen
# kiistaton puoliosto nähdään.
# [addendum] heuristiikka 1b [päätelty 2026-08-29, odottaa havaintoa]
force_money_left_max = 1000

# --- Loss count ---
# Puoliaika alkaa arvosta 1 (pistoolihäviö 1900 $). Voitto laskee laskuria
# yhdellä portaalla, ei nollaa. Rajat 0-4. [addendum] [spine] AD-4
loss_count_half_start = 1
loss_count_min = 0
loss_count_max = 4

# --- Joukkueidentiteetti ja rosterikynnys ---
# Lineupit liitetään samaan team_keyhin, kun yhteisiä pelaajia on vähintään 3.
# [spine] AD-3, AD-6
team_identity_min_common = 3

# Rosterikynnys arvioidaan per kartta: 5/5 vakiorosterista tai vähintään 4/5 +
