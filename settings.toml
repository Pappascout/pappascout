# Pappascoutin asetukset.
#
# Osiot vastaavat AD-3:n partitiota: jokainen vaihe saa parametrikseen vain oman
# osansa, joten kynnysten muuttaminen ei aiheuta uudelleenparsintaa.
#
# Jokainen luku on jäljitettävissä lähteeseen. Merkinnät:
#   [addendum]  = PRD:n addendum, luku 6 (CS2-talousmalli) tai luku 4/5
#   [domain]    = domain-tutkimus 2026-08-27
#   [spine]     = ARCHITECTURE-SPINE, AD-3 / AD-6 / AD-7 / AD-10
#   [kalibroi]  = arvo, joka on tarkoitus säätää oikealla aineistolla; rivin
#                 oma kommentti kertoo mitä havaintoa se odottaa
#
# Avaimia EI kirjoiteta tähän tiedostoon. Ne luetaan koneen omasta tiedostosta
# %USERPROFILE%\.pappascout\.env (FACEIT_API_KEY, FACEIT_DOWNLOADS_TOKEN).


[project]
# Oma joukkue. [domain] Pappaliigan kausi 13.
own_team_name = "PotkukelkkaPeek"

# Arkisto on OneDrivessa ja molempien koneiden yhteinen; koodirepo ei ole.
# [spine] AD-7.
#
# Polussa saa kayttaa ymparistomuuttujia (%USERPROFILE%) ja tildea (~); ne
# laajennetaan latausvaiheessa, joten sama versioitu rivi toimii molemmilla
# koneilla vaikka kayttajanimi olisi eri.
#
# Yksittaisen ajon voi ohjata toiseen arkistoon muokkaamatta tata tiedostoa
# asettamalla ymparistomuuttujan PAPPASCOUT_ARCHIVE_ROOT, esim. PowerShellissa:
#   $env:PAPPASCOUT_ARCHIVE_ROOT = 'D:\pappascout-testiarkisto'
archive_root = '%USERPROFILE%\OneDrive - Finnpark Oy\Finnpark\MDM\Claude code\pappascout-archive'

# Kaikki käyttäjälle näkyvä teksti on suomeksi.
language = "fi"

# Arkiston lukon vanhenemisaika sekunteina. [spine] AD-7 oletus 600.
lock_ttl_seconds = 600


[league]
# Pappaliigan kausi 13, alkoi 3.8.2026. [domain]
season = 13

# Pappaliigan FACEIT organizer -id, jonka kautta kausien championshipit löytyvät.
